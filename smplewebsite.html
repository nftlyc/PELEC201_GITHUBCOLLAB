<!DOCTYPE html>
<html>
<head>
    <title>My Simple Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        footer {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
            margin-top: 20px;
        }

        button{
            padding: 10px 20px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #2980b9;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Just a simple example</p>
    </header>

    <main>
        <h2>Hello!</h2>
        <p>This is a simple website created using HTML and CSS.</p>
        <button onclick="alert('Hello!')">Click Me</button>
    </main>

    <footer>
        © 2025 My Simple Website
    </footer>

</body>
</html>
